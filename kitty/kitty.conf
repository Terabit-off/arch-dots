# --- Настройки шрифта ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Прозрачность и Размытие ---
background            #1c1c1c
background_opacity    0.85
dynamic_background_opacity yes

blur_in_main_window yes
background_blur 20

# --- Цветовая схема ---
foreground            #ffffff
foreground_bold       #ffffff
cursor                #86efac
cursor_text_color     #1c1c1c
selection_foreground  #ffffff
selection_background  #3f3f46

# Границы окон и ссылки
active_border_color   #86efac
inactive_border_color #151515
url_color             #86efac

# Вкладки
active_tab_foreground   #ffffff
active_tab_background   #3f3f46
inactive_tab_foreground #7e7e7e
inactive_tab_background #151515
tab_bar_background      #1c1c1c

# --- Палитра ---
# Black / Bright black
color0  #1c1c1c
color8  #71717a

# Red / Bright red — criticalColor
color1  #f38ba8
color9  #f38ba8

# Green / Bright green — successColor
color2  #86efac
color10 #86efac

# Yellow / Bright yellow — warningColor
color3  #f9e2af
color11 #f9e2af

# Blue / Bright blue
color4  #8ab4f8
color12 #a8c7fa

# Magenta / Bright magenta — weekendColor
color5  #ffd6d6
color13 #ffd6d6

# Cyan / Bright cyan
color6  #94e2d5
color14 #b9f2e9

# White / Bright white
color7  #ffffff
color15 #ffffff

# --- Внутренние отступы ---
window_padding_width 12
placement_strategy center

# --- Разное ---
enable_audio_bell no
confirm_os_window_close 0

remember_window_size no