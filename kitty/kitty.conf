# --- Настройки шрифта ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Прозрачность и Размытие ---
background            #1c1c1c
background_opacity    0.85
dynamic_background_opacity yes

blur_in_main_window yes
background_blur 20

# --- Цветовая схема ---
foreground            #e7e7ea
foreground_bold       #ffffff
cursor                #86efac
cursor_text_color     #101012
selection_foreground  #ffffff
selection_background  #3f3f46

# Границы окон и статус-бар
active_border_color   #86efac
inactive_border_color #151515
url_color             #86efac

# Стилизация вкладок
active_tab_foreground   #101012
active_tab_background   #86efac
inactive_tab_foreground #a1a1aa
inactive_tab_background #151515
tab_bar_background      #141416

# --- Цветовая палитра терминала ---
# Black / Bright black
color0  #1c1c1c
color8  #4b4b52

# Red / Bright red
color1  #f38ba8
color9  #ffb3c6

# Green / Bright green
color2  #86efac
color10 #b8ffd0

# Yellow / Bright yellow
color3  #f9e2af
color11 #fff0c2

# Blue / Bright blue
color4  #8ab4f8
color12 #a8c7fa

# Magenta / Bright magenta
color5  #ffd6d6
color13 #ffe9e9

# Cyan / Bright cyan
color6  #94e2d5
color14 #b9f2e9

# White / Bright white
color7  #d4d4d8
color15 #ffffff

# --- Внутренние отступы ---
window_padding_width 12
placement_strategy center

# --- Разное ---
enable_audio_bell no
confirm_os_window_close 0

remember_window_size no